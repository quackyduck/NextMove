# Include inside the existing nicolasmelo.com HTTPS server after validation.
# Port 5001 must still be verified unused before deployment.
location = /nextmove {
    return 308 /nextmove/$is_args$args;
}

location ^~ /nextmove/ {
    # Preserve the prefix. PrefixMount removes it inside the application.
    proxy_pass http://127.0.0.1:5001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Overwrite (never append): the app trusts exactly this one hop for per-IP login budgets.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Prefix "";
    client_max_body_size 10m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;
    access_log off;
}
