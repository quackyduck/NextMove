# Include inside the existing nicolasmelo.com HTTPS server after validation.
# Port 5001 must still be verified unused before deployment.
location = /nextmove {
    return 308 /nextmove/$is_args$args;
}

# The Resume Agent harness reaches these over the private network only (docs/API.md).
location ^~ /nextmove/api/v1/harness/ {
    return 404;
}

location ^~ /nextmove/api/v1/me/ {
    return 404;
}

location ^~ /nextmove/ {
    # Preserve the prefix. PrefixMount removes it inside the application.
    proxy_pass http://127.0.0.1:5001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Overwrite (never append): the app trusts exactly this one hop for per-IP login budgets.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Prefix "";
    client_max_body_size 10m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;
    access_log off;
}

# OAuth discovery for agents (MCP clients). RFC 8414/9728 put the well-known
# segment before the path, so /nextmove's metadata lives outside /nextmove/.
# Each maps to the app's own copy; the app sets issuer from PUBLIC_BASE_URL.
location = /.well-known/oauth-authorization-server/nextmove {
    proxy_pass http://127.0.0.1:5001/nextmove/.well-known/oauth-authorization-server;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Prefix "";
}

location = /.well-known/oauth-protected-resource/nextmove/mcp {
    proxy_pass http://127.0.0.1:5001/nextmove/.well-known/oauth-protected-resource/mcp;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Prefix "";
}
