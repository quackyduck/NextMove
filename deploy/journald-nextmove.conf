# /etc/systemd/journald@nextmove.conf: retention for the test server's own journal namespace.
# next-move.service and next-move-worker.service set LogNamespace=nextmove, so their logs live in a separate
# journal with these limits, without changing retention for the other apps on this shared host.
# The privacy page promises server logs are kept only a few days: about 7. journald deletes whole files, so
# files are cut daily too: an entry is gone at most about a day after it turns 7 days old.
[Journal]
Storage=persistent
MaxRetentionSec=7day
MaxFileSec=1day
SystemMaxUse=200M
